openapi: 3.0.0
info:
  title: Wayback API
  version: "1.0.0"
servers:
  - url: https://archive.org
paths:
  /wayback/available:
    get:
      operationId: getWaybackAvailability
      summary: Check for an archived snapshot
          get:
      operationId: getWaybackAvailability
      summary: Check for an archived snapshot
      x-kong-plugin-rate-limiting:
        enabled: true
        config:
          minute: 5
          limit_by: ip
          policy: local
          parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  archived_snapshots:
                    type: object
                    additionalProperties: true
