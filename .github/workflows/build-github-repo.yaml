name: Deploy GitHub Repository API

on:
  push:
    branches: [feat/github-repo]
    paths:
      - demo/github-repo/openapi.yaml
      - .github/workflows/build-github-repo.yaml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up decK
        uses: kong/setup-deck@v1
        with:
          deck-version: '1.69.0'
          wrapper: false

      - name: Generate and validate Kong configuration
        run: |
          deck file openapi2kong --spec demo/github-repo/openapi.yaml \
            --output-file "$RUNNER_TEMP/github-repo.yaml"
          deck file validate "$RUNNER_TEMP/github-repo.yaml"

      - name: Deploy to Kong sandbox
        env:
          DECK_KONNECT_CONTROL_PLANE_NAME: ${{ vars.HTTPBIN_SANDBOX_CP }}
          DECK_KONNECT_ADDR: ${{ vars.KONNECT_ADDR }}
          DECK_KONNECT_TOKEN: ${{ secrets.KONNECT_PAT }}
        run: |
          : "${DECK_KONNECT_CONTROL_PLANE_NAME:?Missing sandbox control plane}"
          : "${DECK_KONNECT_ADDR:?Missing Konnect address}"
          : "${DECK_KONNECT_TOKEN:?Missing Konnect token}"
          deck gateway ping
          deck gateway apply "$RUNNER_TEMP/github-repo.yaml"

      - name: Verify GitHub response through Kong
        run: |
          curl --fail --silent --show-error \
            --retry 4 --retry-all-errors --retry-delay 3 --max-time 20 \
            --user-agent 'kong-sandbox-demo' \
            --header 'Accept: application/vnd.github+json' \
            'https://10f31a9f03.us.serverless.gateways.konggateway.com/repos/Kong/deck' \
            --output "$RUNNER_TEMP/repo.json"
          jq -e '.full_name == "Kong/deck"' "$RUNNER_TEMP/repo.json"
