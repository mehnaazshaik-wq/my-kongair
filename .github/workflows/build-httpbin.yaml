name: Build HTTPBin API

on:
  push:
    branches:
      - feat/httpbin
    paths:
      - demo/httpbin/openapi.yaml
      - .github/workflows/build-httpbin.yaml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up decK
        uses: kong/setup-deck@v1
        with:
          deck-version: '1.40.3'
          wrapper: false

      - name: Generate and validate Kong configuration
        run: |
          deck file openapi2kong --spec demo/httpbin/openapi.yaml \
            --output-file "$RUNNER_TEMP/httpbin-kong.yaml"
          deck file validate "$RUNNER_TEMP/httpbin-kong.yaml"
          cat "$RUNNER_TEMP/httpbin-kong.yaml"

      - name: Generate and validate Kong configuration
        if: ${{ github.ref == 'refs/heads/feat/httpbin' && vars.HTTPBIN_SANDBOX_CP != '' }}
        env:
          DECK_KONNECT_CONTROL_PLANE_NAME: ${{ vars.HTTPBIN_SANDBOX_CP }}
          DECK_KONNECT_TOKEN: ${{ secrets.KONNECT_PAT }}
          DECK_KONNECT_ADDR: ${{ vars.KONNECT_ADDR }}
        run: |
          deck gateway ping
          deck gateway apply "$RUNNER_TEMP/httpbin-kong.yaml"
